name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module
        run: go mod tidy && git diff --exit-code

      - name: Test
        run: go test ./...

      - name: Race tests
        run: go test -race ./internal/apply ./internal/daemon ./internal/hypr ./internal/ipc ./internal/tui

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build
        run: go build ./cmd/hyprmoncfg ./cmd/hyprmoncfgd
